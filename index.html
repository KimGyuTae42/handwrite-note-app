<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>손글씨 인식 노트</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <!-- ===================== 로그인 화면 ===================== -->
  <section id="view-auth" class="view">
    <div class="auth-wrap">
      <div class="auth-box">
        <h2>손글씨 인식 노트</h2>
        <p class="hint">계정으로 로그인하면 다른 기기에서도 내 노트를 이어서 쓸 수 있어요.</p>

        <div id="auth-form-area">
          <input type="email" id="auth-email" class="text-input" placeholder="이메일" style="width:100%;" />
          <input type="password" id="auth-password" class="text-input" placeholder="비밀번호 (6자 이상)" style="width:100%;margin-top:8px;" />
          <div id="auth-error" class="auth-error hidden"></div>
          <button class="btn primary" id="auth-login-btn" style="width:100%;margin-top:12px;">로그인</button>
          <button class="btn plain" id="auth-signup-btn" style="width:100%;margin-top:8px;">회원가입</button>
        </div>

        <div id="auth-not-configured" class="hidden">
          <p class="hint">Supabase 연동이 아직 설정되지 않았어요.<br/>.env(.local)에 URL/anon key를 채운 뒤 다시 열어주세요.</p>
          <button class="btn primary" id="auth-skip-btn" style="width:100%;margin-top:12px;">로그인 없이 이 기기에서만 써보기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 목록 화면 ===================== -->
  <section id="view-list" class="view">
    <aside class="sidebar">
      <div class="sidebar-title">문서</div>
      <div id="folder-tree" class="folder-tree"></div>
      <div class="trash-row" id="trash-btn">🗑️ 휴지통</div>
    </aside>
    <main class="list-main">
      <div class="topbar">
        <button class="icon-btn" id="back-btn" title="뒤로">‹</button>
        <h2 id="current-folder-name">문서</h2>
        <div class="topbar-actions">
          <button class="icon-btn" id="new-btn" title="새로 만들기">＋</button>
          <button class="icon-btn" id="search-btn" title="검색">🔍</button>
          <button class="icon-btn" id="settings-btn" title="설정">⚙️</button>
        </div>
      </div>
      <div id="search-bar" class="search-bar hidden">
        <input id="search-input" type="text" placeholder="노트 검색" />
      </div>
      <div id="note-grid" class="note-grid"></div>
      <div id="empty-hint" class="empty-hint hidden">＋ 버튼을 눌러 새 폴더나 노트를 만들어보세요.</div>
    </main>
  </section>

  <!-- ===================== 설정 화면 ===================== -->
  <section id="view-settings" class="view">
    <main class="settings-main">
      <div class="topbar">
        <button class="icon-btn" id="settings-back-btn" title="뒤로">‹</button>
        <h2>설정</h2>
      </div>

      <div class="settings-section">
        <h3>기본 템플릿</h3>
        <p class="hint">새 노트를 만들 때 기본으로 사용할 배경(PDF 1페이지)을 등록하세요.</p>
        <div id="template-list" class="thumb-row"></div>
        <button class="ghost-btn" id="add-template-btn">＋ 템플릿 추가 (PDF)</button>
        <input type="file" id="template-file-input" accept="application/pdf" class="hidden" />
      </div>

      <div class="settings-section">
        <h3>글꼴</h3>
        <p class="hint">인식된 손글씨를 어떤 글꼴로 바꿀지 등록하세요 (TTF 파일).</p>
        <div id="font-list" class="font-row"></div>
        <button class="ghost-btn" id="add-font-btn">＋ 글꼴 추가 (TTF)</button>
        <input type="file" id="font-file-input" accept=".ttf,font/ttf" class="hidden" />
      </div>

      <div class="settings-section">
        <h3>인식 설정</h3>
        <label class="hint">변환 신뢰도 기준 (이 값 이상일 때만 글자로 변환)</label>
        <div class="threshold-row">
          <input type="range" id="threshold-range" min="30" max="95" value="80" />
          <span id="threshold-value">80%</span>
        </div>
      </div>

      <div class="settings-section">
        <h3>계정 정보</h3>
        <div id="account-info"></div>
      </div>
    </main>
  </section>

  <!-- ===================== 노트 편집 화면 ===================== -->
  <section id="view-note" class="view">
    <div class="tabbar">
      <button class="icon-btn" id="home-btn" title="목록으로">🏠</button>
      <div id="tabs" class="tabs"></div>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <div class="pill tools-pill" id="tools-pill">
        <button class="tool-btn" data-tool="pen-fountain" title="만년필">
          <svg viewBox="0 0 24 24"><polygon points="4,20 4,16.5 14.5,6 18.5,10 8,20.5" /></svg>
        </button>
        <button class="tool-btn" data-tool="pen-brush" title="붓">
          <svg viewBox="0 0 24 24"><polygon points="9,21 7,19 8,16 15,9 18,12 11,19" /></svg>
        </button>
        <button class="tool-btn" data-tool="highlighter" title="하이라이터">
          <svg viewBox="0 0 24 24"><polygon points="5,20 5,17 14,8 18,12 9,21" /></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="지우개">
          <svg viewBox="0 0 24 24"><rect x="6" y="9" width="12" height="10" rx="2.5" /></svg>
        </button>
        <button class="tool-btn" data-tool="lasso" title="올가미">
          <svg viewBox="0 0 24 24">
            <ellipse class="lasso-loop" cx="12" cy="11" rx="8" ry="6" stroke-dasharray="2.6 2.6" />
            <circle cx="12" cy="18.5" r="1.4" />
          </svg>
        </button>
        <button class="tool-btn" data-tool="select" title="선택">
          <svg viewBox="0 0 24 24"><polygon points="5,3 5,19 9.5,15.5 12.5,21 15,19.7 12,14.2 18,14" /></svg>
        </button>
        <span class="pill-sep"></span>
        <button class="icon-only" id="convert-btn" title="지금 변환">✨</button>
        <button class="icon-only" id="export-btn" title="내보내기">⇪</button>
        <button class="icon-only" id="style-toggle-btn" title="색상/두께">›</button>
      </div>
      <div class="pill history-pill" id="history-pill">
        <button class="icon-only" id="undo-btn" title="실행 취소">↺</button>
        <button class="icon-only" id="redo-btn" title="다시 실행">↻</button>
      </div>
      <div class="pill style-pill" id="style-pill">
        <div id="color-swatches" class="swatches"></div>
        <button class="swatch add-swatch" id="add-color-btn" title="색상 추가">＋</button>
        <input type="color" id="color-picker" class="color-picker-hidden" value="#111111" />
        <span class="pill-sep"></span>
        <div class="thickness-dots" id="thickness-dots"></div>
        <span class="pill-sep"></span>
        <button class="icon-only wave-btn" title="곡선 스타일 (추후 구현)">〜</button>
      </div>

      <div class="canvas-stage" id="canvas-stage">
        <img id="template-bg" draggable="false" />
        <canvas id="ink-canvas"></canvas>
        <div id="text-layer"></div>
        <canvas id="lasso-overlay"></canvas>
      </div>
      <div id="ocr-status" class="ocr-status hidden">인식 중…</div>
      <button class="pill zoom-pill hidden" id="zoom-pill" title="눌러서 100%로 되돌리기">100%</button>
    </div>
  </section>

</div>

<div id="modal-root"></div>

<!-- 외부 라이브러리 (CDN) -->
<script src="https://unpkg.com/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>

<script src="js/db.js"></script>
<script src="js/canvas.js"></script>
<script src="js/ocr.js"></script>
<script src="js/cnn.js"></script>
<script type="module" src="js/supabaseClient.js"></script>
<script src="js/app.js"></script>
</body>
</html>
